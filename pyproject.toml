[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-cmnd"
version = "0.2.0"
description = "Safe Linux deployment and Philips Professional TV protocol qualification tooling"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Music City Telecom" }]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
cmndctl = "cmnd_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
