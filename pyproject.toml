[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-cmnd"
version = "0.6.2"
description = "Safe Linux deployment and Philips Professional TV protocol qualification tooling"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Music City Telecom" }]
dependencies = []

[project.scripts]
cmndctl = "cmnd_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cmnd_linux = ["management/*.html", "management/*.css", "management/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
