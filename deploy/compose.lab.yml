services:
  mysql57:
    image: mysql:5.7.44
    restart: unless-stopped
    env_file: /etc/cmnd/mysql.env
    command:
      - --lower-case-table-names=0
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --max-allowed-packet=256M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - /var/lib/cmnd/mysql57:/var/lib/mysql
    networks: [cmnd_db]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  cmnd_db:
    internal: true
