# Render these environment variables from /etc/cmnd/cmnd.toml during the
# approved Apache/SmartCMS deployment step.
Listen ${CMND_APACHE_HTTP_PORT}
<VirtualHost *:${CMND_APACHE_HTTP_PORT}>
    DocumentRoot /opt/cmnd/current/SmartCMS
    <Directory /opt/cmnd/current/SmartCMS>
        AllowOverride None
        Options FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
