name: 0.8 Development CI

on:
  push:
    branches:
      - develop/0.8.0
  pull_request:
    branches:
      - develop/0.8.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Source tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out 0.8 source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  ubuntu-22-source-compat:
    name: Ubuntu 22.04 / Python 3.10 source compatibility (informational)
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - name: Check out 0.8 source
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python 3.10 TOML compatibility parser
        run: python -m pip install --disable-pip-version-check --no-input 'tomli==2.2.1'
      - name: Run source regression suite on 22.04 compatibility runtime
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package-build:
    name: Debian package build smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out 0.8 source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate installer source and maintainer scripts
        run: |
          python -m compileall -q src scripts
          sh -n packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm packaging/debian/cmndctl
          sh -n packaging/cmnd-linux/config packaging/cmnd-linux/postinst packaging/cmnd-linux/prerm packaging/cmnd-linux/postrm
      - name: Build payload and user-facing meta packages
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_deb.py
          python scripts/build_meta_deb.py
          dpkg-deb -I dist/linux-cmnd_0.8.0_amd64.deb
          dpkg-deb -I dist/cmnd-linux_0.8.0_all.deb
      - name: Smoke-install generated packages without runtime activation
        shell: bash
        run: |
          set -euo pipefail
          make_stub() {
            name="$1"; version="$2"
            root="$(mktemp -d)"
            mkdir -p "$root/DEBIAN"
            cat >"$root/DEBIAN/control" <<EOF
          Package: $name
          Version: $version
          Section: admin
          Priority: optional
          Architecture: all
          Maintainer: CI <ci@example.invalid>
          Description: CI dependency stub only
          EOF
            dpkg-deb --build "$root" "dist/${name}_${version}_all.deb" >/dev/null
            rm -rf "$root"
          }
          make_stub cmnd-vendor-759 7.5.9-1
          make_stub cmnd-tomcat9 9.0.121-1
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ./dist/linux-cmnd_0.8.0_amd64.deb \
            ./dist/cmnd-vendor-759_7.5.9-1_all.deb \
            ./dist/cmnd-tomcat9_9.0.121-1_all.deb \
            ./dist/cmnd-linux_0.8.0_all.deb
          test "$(dpkg-query -W -f='${Status}' cmnd-linux)" = "install ok installed"
          test -x /usr/bin/cmndctl
          test ! -e /var/lib/cmnd-deployment
          sudo env DEBIAN_FRONTEND=noninteractive apt-get remove -y cmnd-linux
          test ! -e /var/lib/cmnd-deployment

  safety-diff:
    name: Frozen 0.7.1 ancestry check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify 0.8 is descended from immutable v0.7.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          base=$(git merge-base HEAD v0.7.1)
          expected=$(git rev-list -n1 v0.7.1)
          test "$base" = "$expected"
          test "$(git rev-parse v0.7.1^{tree})" = "$(git rev-parse "$expected^{tree}")"
